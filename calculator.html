<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator | HIMANSHU</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html" target="_blank">HIMANSHU</a><button class="menu">☰</button><nav><a class="" href="index.html" target="_blank">Home</a><a class="" href="about.html" target="_blank">About</a><a class="" href="skills.html" target="_blank">Skills</a><a class="" href="certificates.html" target="_blank">Certificates</a><a class="active" href="projects.html" target="_blank">Projects</a><a class="" href="ai-lab.html" target="_blank">AI Lab</a><a class="" href="goals.html" target="_blank">Goals</a><a class="" href="contact.html" target="_blank">Contact</a></nav></header><main class="page"><div class="title"><p class="eyebrow">PROJECT • 01</p><h1>Smart <span>Calculator</span></h1></div><div class="card calc"><input id="d" value="0" readonly><div class="calcgrid"><button onclick="p('C')">C</button><button onclick="p('7')">7</button><button onclick="p('8')">8</button><button onclick="p('9')">9</button><button onclick="p('/')">÷</button><button onclick="p('4')">4</button><button onclick="p('5')">5</button><button onclick="p('6')">6</button><button onclick="p('*')">×</button><button onclick="p('1')">1</button><button onclick="p('2')">2</button><button onclick="p('3')">3</button><button onclick="p('-')">-</button><button onclick="p('0')">0</button><button onclick="p('.')">.</button><button onclick="p('+')">+</button><button onclick="p('=')">=</button></div></div><script>let d=document.getElementById('d');function p(x){if(x==='C')d.value='0';else if(x==='='){try{d.value=String(Function('return '+d.value)())}catch(e){d.value='Error'}}else{if(d.value==='0')d.value='';d.value+=x}}</script></main><footer>© 2026 Himanshu Kumar Singh • Keep Learning, Keep Building, Keep Growing.</footer><script src="script.js"></script></body></html>
